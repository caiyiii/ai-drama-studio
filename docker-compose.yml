services:
  postgres:
    image: postgres:16-alpine
    container_name: ai-drama-studio-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_drama_studio
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_drama_studio"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
